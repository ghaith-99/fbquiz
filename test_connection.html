<!DOCTYPE html>
<html>
<head>
    <title>اختبار اتصال Supabase</title>
</head>
<body>
    <h1>اختبار اتصال Supabase</h1>
    <button id="testButton">اختبار الاتصال</button>
    <div id="result"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        document.getElementById('testButton').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'جاري الاختبار...';
            
            try {
                // استخدم بيانات الاتصال الجديدة
                const SUPABASE_URL = 'https://yuddtnebiafcyuhcmfoo.supabase.co';
                const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1ZGR0bmViaWFmY3l1aGNtZm9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYxMDc0ODYsImV4cCI6MjA2MTY4MzQ4Nn0.mA1o_ynHyO2Mn7QAzwvV743vh99hdmWO1OoX7AXjfj4';
                
                // إنشاء عميل Supabase بالطريقة الصحيحة
                const { createClient } = supabase;
                const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
                
                // اختبار استعلام بسيط
                const { data, error } = await supabaseClient
                    .from('countries')
                    .select('*')
                    .limit(1);
                
                if (error) {
                    throw error;
                }
                
                resultDiv.innerHTML = `
                    <p style="color: green;">تم الاتصال بنجاح!</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <p style="color: red;">فشل الاتصال: ${error.message}</p>
                    <pre>${JSON.stringify(error, null, 2)}</pre>
                `;
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
