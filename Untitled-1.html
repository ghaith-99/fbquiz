<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Challenge Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0e4c92;
            --secondary-color: #1e7145;
            --accent-color: #e31b23;
            --light-bg: #f8f9fa;
            --dark-bg: #212529;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-bg);
        }
        
        .navbar {
            background-color: var(--primary-color);
        }
        
        .card {
            transition: transform 0.3s;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card-img-top {
            height: 200px;
            object-fit: cover;
            cursor: pointer;
        }
        
        .flag-img, .club-logo {
            width: 30px;
            height: 20px;
            object-fit: contain;
            margin-right: 5px;
        }
        
        .modal-img {
            width: 100%;
            height: auto;
        }
        
        .section-title {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        
        .nav-pills .nav-link.active {
            background-color: var(--primary-color);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-success {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }
        
        .btn-danger {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        
        .previous-clubs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        #adminPanel {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-futbol me-2"></i>
                Football Challenge Platform
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#admin">Admin</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <!-- Home Section -->
        <section id="home" class="mb-5">
            <h2 class="section-title">Football Personalities</h2>
            
            <!-- Category Navigation -->
            <ul class="nav nav-pills mb-4" id="categoryTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="current-players-tab" data-bs-toggle="pill" data-bs-target="#current-players" type="button" role="tab">Current Players</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="retired-players-tab" data-bs-toggle="pill" data-bs-target="#retired-players" type="button" role="tab">Retired Players</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="coaches-tab" data-bs-toggle="pill" data-bs-target="#coaches" type="button" role="tab">Coaches</button>
                </li>
            </ul>
            
            <!-- Tab Content -->
            <div class="tab-content" id="categoryTabsContent">
                <!-- Current Players -->
                <div class="tab-pane fade show active" id="current-players" role="tabpanel">
                    <div class="row" id="currentPlayersContainer">
                        <!-- Current players will be loaded here -->
                    </div>
                </div>
                
                <!-- Retired Players -->
                <div class="tab-pane fade" id="retired-players" role="tabpanel">
                    <div class="row" id="retiredPlayersContainer">
                        <!-- Retired players will be loaded here -->
                    </div>
                </div>
                
                <!-- Coaches -->
                <div class="tab-pane fade" id="coaches" role="tabpanel">
                    <div class="row" id="coachesContainer">
                        <!-- Coaches will be loaded here -->
                    </div>
                </div>
            </div>
        </section>
        
        <!-- Admin Section -->
        <section id="admin" class="mb-5 d-none">
            <h2 class="section-title">Admin Panel</h2>
            <div id="adminPanel">
                <div class="row mb-4">
                    <div class="col-md-6">
                        <h4>Manage Football Personalities</h4>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPersonModal">
                            <i class="fas fa-plus me-2"></i>Add New
                        </button>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchAdmin" placeholder="Search...">
                            <button class="btn btn-outline-secondary" type="button">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Age</th>
                                <th>Nationality</th>
                                <th>Role</th>
                                <th>Current Club</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody">
                            <!-- Admin table data will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
    
    <!-- Fullscreen Image Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="imageModalTitle">Image</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img src="" class="modal-img" id="fullscreenImage" alt="Fullscreen Image">
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Person Modal -->
    <div class="modal fade" id="addPersonModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="personModalTitle">Add New Person</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="personForm">
                        <input type="hidden" id="personId">
                        <div class="mb-3">
                            <label for="personImage" class="form-label">Image</label>
                            <input type="file" class="form-control" id="personImage" accept="image/*">
                            <div id="imagePreviewContainer" class="mt-2 d-none">
                                <img id="imagePreview" style="max-width: 200px; max-height: 200px;">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="personName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="personName" required>
                        </div>
                        <div class="mb-3">
                            <label for="personAge" class="form-label">Age</label>
                            <input type="number" class="form-control" id="personAge" required min="16" max="100">
                        </div>
                        <div class="mb-3">
                            <label for="personNationality" class="form-label">Nationality</label>
                            <select class="form-select" id="personNationality" required>
                                <option value="">Select nationality</option>
                                <option value="england">England</option>
                                <option value="spain">Spain</option>
                                <option value="germany">Germany</option>
                                <option value="france">France</option>
                                <option value="italy">Italy</option>
                                <option value="portugal">Portugal</option>
                                <option value="brazil">Brazil</option>
                                <option value="argentina">Argentina</option>
                                <!-- More countries would be added here -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="personRole" class="form-label">Role</label>
                            <select class="form-select" id="personRole" required>
                                <option value="">Select role</option>
                                <option value="current">Current Player</option>
                                <option value="retired">Retired Player</option>
                                <option value="coach">Coach</option>
                            </select>
                        </div>
                        <div class="mb-3" id="currentClubContainer">
                            <label for="currentClub" class="form-label">Current Club</label>
                            <select class="form-select" id="currentClub">
                                <option value="">Select club</option>
                                <option value="manchester_united">Manchester United</option>
                                <option value="barcelona">Barcelona</option>
                                <option value="real_madrid">Real Madrid</option>
                                <option value="bayern_munich">Bayern Munich</option>
                                <option value="psg">Paris Saint-Germain</option>
                                <!-- More clubs would be added here -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Previous Clubs</label>
                            <div class="row" id="clubsCheckboxes">
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="manchester_united" id="club_manchester_united">
                                        <label class="form-check-label" for="club_manchester_united">
                                            Manchester United
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="barcelona" id="club_barcelona">
                                        <label class="form-check-label" for="club_barcelona">
                                            Barcelona
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="real_madrid" id="club_real_madrid">
                                        <label class="form-check-label" for="club_real_madrid">
                                            Real Madrid
                                        </label>
                                    </div>
                                </div>
                                <!-- More clubs would be added here -->
                            </div>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sample data (in a real app, this would come from a database)
        let footballPersonalities = [
            {
                id: 1,
                name: "Cristiano Ronaldo",
                age: 38,
                nationality: "portugal",
                role: "current",
                image: "https://example.com/ronaldo.jpg",
                currentClub: "al_nassr",
                previousClubs: ["sporting_cp", "manchester_united", "real_madrid", "juventus"]
            },
            {
                id: 2,
                name: "Lionel Messi",
                age: 36,
                nationality: "argentina",
                role: "current",
                image: "https://example.com/messi.jpg",
                currentClub: "inter_miami",
                previousClubs: ["barcelona", "psg"]
            },
            {
                id: 3,
                name: "Zinedine Zidane",
                age: 51,
                nationality: "france",
                role: "retired",
                image: "https://example.com/zidane.jpg",
                previousClubs: ["cannes", "bordeaux", "juventus", "real_madrid"]
            },
            {
                id: 4,
                name: "Pep Guardiola",
                age: 52,
                nationality: "spain",
                role: "coach",
                image: "https://example.com/guardiola.jpg",
                currentClub: "manchester_city",
                previousClubs: ["barcelona", "bayern_munich"]
            }
        ];

        // Club and country data
        const clubs = {
            "manchester_united": {
                name: "Manchester United",
                logo: "https://example.com/man_utd.png"
            },
            "barcelona": {
                name: "Barcelona",
                logo: "https://example.com/barcelona.png"
            },
            "real_madrid": {
                name: "Real Madrid",
                logo: "https://example.com/real_madrid.png"
            },
            // More clubs would be added here
        };

        const countries = {
            "england": {
                name: "England",
                flag: "https://example.com/england.png"
            },
            "spain": {
                name: "Spain",
                flag: "https://example.com/spain.png"
            },
            "portugal": {
                name: "Portugal",
                flag: "https://example.com/portugal.png"
            },
            // More countries would be added here
        };

        // DOM elements
        const currentPlayersContainer = document.getElementById('currentPlayersContainer');
        const retiredPlayersContainer = document.getElementById('retiredPlayersContainer');
        const coachesContainer = document.getElementById('coachesContainer');
        const adminTableBody = document.getElementById('adminTableBody');
        const personForm = document.getElementById('personForm');
        const imagePreview = document.getElementById('imagePreview');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');

        // Navigation between home and admin
        document.querySelectorAll('.navbar-nav .nav-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const target = this.getAttribute('href').substring(1);
                
                document.querySelectorAll('section').forEach(section => {
                    section.classList.add('d-none');
                });
                
                document.getElementById(target).classList.remove('d-none');
                
                document.querySelectorAll('.navbar-nav .nav-link').forEach(navLink => {
                    navLink.classList.remove('active');
                });
                
                this.classList.add('active');
            });
        });

        // Load data into UI
        function loadData() {
            // Clear containers
            currentPlayersContainer.innerHTML = '';
            retiredPlayersContainer.innerHTML = '';
            coachesContainer.innerHTML = '';
            adminTableBody.innerHTML = '';
            
            // Filter and display data
            footballPersonalities.forEach(person => {
                // Create card for the appropriate section
                if (person.role === 'current') {
                    currentPlayersContainer.appendChild(createPersonCard(person));
                } else if (person.role === 'retired') {
                    retiredPlayersContainer.appendChild(createPersonCard(person));
                } else if (person.role === 'coach') {
                    coachesContainer.appendChild(createPersonCard(person));
                }
                
                // Add to admin table
                adminTableBody.appendChild(createAdminTableRow(person));
            });
        }

        // Create a card for a person
        function createPersonCard(person) {
            const col = document.createElement('div');
            col.className = 'col-md-4';
            
            const card = document.createElement('div');
            card.className = 'card h-100';
            
            // Create card content based on role
            let cardContent = `
                <img src="${person.image}" class="card-img-top" alt="${person.name}" onclick="openImageModal('${person.image}', '${person.name}')">
                <div class="card-body">
                    <h5 class="card-title">${person.name}</h5>
                    <p class="card-text">
                        <img src="${countries[person.nationality]?.flag || 'https://example.com/default_flag.png'}" class="flag-img" alt="${person.nationality}">
                        Age: ${person.age}
                    </p>
            `;
            
            // Add current club for current players
            if (person.role === 'current') {
                cardContent += `
                    <p class="card-text">
                        Current Club: 
                        <img src="${clubs[person.currentClub]?.logo || 'https://example.com/default_club.png'}" class="club-logo" alt="${person.currentClub}">
                        ${clubs[person.currentClub]?.name || person.currentClub}
                    </p>
                `;
            }
            
            // Add previous clubs
            cardContent += `
                <p class="card-text">
                    ${person.role === 'coach' ? 'Clubs Coached:' : 'Previous Clubs:'} 
                    <div class="previous-clubs">
            `;
            
            person.previousClubs.forEach(club => {
                cardContent += `
                    <img src="${clubs[club]?.logo || 'https://example.com/default_club.png'}" class="club-logo" title="${clubs[club]?.name || club}" alt="${club}">
                `;
            });
            
            cardContent += `
                    </div>
                </p>
                </div>
            `;
            
            card.innerHTML = cardContent;
            col.appendChild(card);
            
            return col;
        }

        // Create a table row for admin panel
        function createAdminTableRow(person) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><img src="${person.image}" alt="${person.name}" style="width: 50px; height: 50px; object-fit: cover;"></td>
                <td>${person.name}</td>
                <td>${person.age}</td>
                <td>
                    <img src="${countries[person.nationality]?.flag || 'https://example.com/default_flag.png'}" class="flag-img" alt="${person.nationality}">
                    ${countries[person.nationality]?.name || person.nationality}
                </td>
                <td>${person.role === 'current' ? 'Current Player' : person.role === 'retired' ? 'Retired Player' : 'Coach'}</td>
                <td>
                    ${person.currentClub ? `
                        <img src="${clubs[person.currentClub]?.logo || 'https://example.com/default_club.png'}" class="club-logo" alt="${person.currentClub}">
                        ${clubs[person.currentClub]?.name || person.currentClub}
                    ` : 'N/A'}
                </td>
                <td>
                    <button class="btn btn-sm btn-primary" onclick="editPerson(${person.id})">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deletePerson(${person.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            `;
            return row;
        }

        // Open image in modal
        function openImageModal(imageSrc, title) {
            document.getElementById('fullscreenImage').src = imageSrc;
            document.getElementById('imageModalTitle').textContent = title;
            new bootstrap.Modal(document.getElementById('imageModal')).show();
        }

        // Edit person
        function editPerson(id) {
            const person = footballPersonalities.find(p => p.id === id);
            if (!person) return;
            
            // Fill form with person data
            document.getElementById('personId').value = person.id;
            document.getElementById('personName').value = person.name;
            document.getElementById('personAge').value = person.age;
            document.getElementById('personNationality').value = person.nationality;
            document.getElementById('personRole').value = person.role;
            
            if (person.currentClub) {
                document.getElementById('currentClub').value = person.currentClub;
            }
            
            // Reset checkboxes
            document.querySelectorAll('#clubsCheckboxes input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = person.previousClubs.includes(checkbox.value);
            });
            
            // Show image preview
            if (person.image) {
                imagePreview.src = person.image;
                imagePreviewContainer.classList.remove('d-none');
            }
            
            // Update modal title
            document.getElementById('personModalTitle').textContent = 'Edit Person';
            
            // Show modal
            new bootstrap.Modal(document.getElementById('addPersonModal')).show();
        }

        // Delete person
        function deletePerson(id) {
            if (confirm('Are you sure you want to delete this person?')) {
                footballPersonalities = footballPersonalities.filter(p => p.id !== id);
                loadData();
            }
        }

        // Handle form submission
        personForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('personId').value;
            const name = document.getElementById('personName').value;
            const age = document.getElementById('personAge').value;
            const nationality = document.getElementById('personNationality').value;
            const role = document.getElementById('personRole').value;
            const currentClub = document.getElementById('currentClub').value;
            
            // Get selected previous clubs
            const previousClubs = [];
            document.querySelectorAll('#clubsCheckboxes input[type="checkbox"]:checked').forEach(checkbox => {
                previousClubs.push(checkbox.value);
            });
            
            // Get image (in a real app, this would upload the file to a server)
            let image = '';
            if (imagePreview.src) {
                image = imagePreview.src;
            } else {
                // Default image based on role
                image = `https://example.com/default_${role}.jpg`;
            }
            
            if (id) {
                // Update existing person
                const index = footballPersonalities.findIndex(p => p.id === parseInt(id));
                if (index !== -1) {
                    footballPersonalities[index] = {
                        ...footballPersonalities[index],
                        name,
                        age: parseInt(age),
                        nationality,
                        role,
                        image,
                        currentClub,
                        previousClubs
                    };
                }
            } else {
                // Add new person
                const newId = Math.max(...footballPersonalities.map(p => p.id), 0) + 1;
                footballPersonalities.push({
                    id: newId,
                    name,
                    age: parseInt(age),
                    nationality,
                    role,
                    image,
                    currentClub,
                    previousClubs
                });
            }
            
            // Reset form and close modal
            personForm.reset();
            imagePreviewContainer.classList.add('d-none');
            bootstrap.Modal.getInstance(document.getElementById('addPersonModal')).hide();
            
            // Reload data
            loadData();
        });

        // Handle image preview
        document.getElementById('personImage').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreviewContainer.classList.remove('d-none');
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // Handle role change to show/hide current club
        document.getElementById('personRole').addEventListener('change', function() {
            const currentClubContainer = document.getElementById('currentClubContainer');
            if (this.value === 'current' || this.value === 'coach') {
                currentClubContainer.classList.remove('d-none');
            } else {
                currentClubContainer.classList.add('d-none');
            }
        });

        // Reset form when modal is closed
        document.getElementById('addPersonModal').addEventListener('hidden.bs.modal', function() {
            personForm.reset();
            document.getElementById('personId').value = '';
            document.getElementById('personModalTitle').textContent = 'Add New Person';
            imagePreviewContainer.classList.add('d-none');
        });

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
        });
    </script>
</body>
</html>
